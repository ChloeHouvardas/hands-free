# Every threshold in the gesture layer. Nothing tunable lives in the code.
#
# The numbers here aren't guesses — they came out of measuring the recordings in
# recordings/. Run `python replay.py recordings/*.jsonl --quiet` after changing
# anything and see what moved.
#
# Angles are degrees. Distances are multiples of hand size, so they hold at any
# distance from the camera. Times are seconds, never frame counts — the frame
# rate wanders between 8 and 12 fps and a frame count means a different amount
# of real time from one run to the next.

[camera]
# The camera is physically mounted upside down, so every frame is rotated
# before it reaches MediaPipe — which is trained on upright hands and gets
# noticeably worse on rotated ones. Costs about a millisecond.
# Change this if you remount the camera; --rotate overrides it for a one-off.
rotate = 180

[fingers]
# A finger counts as extended above `extend` and only stops counting below
# `curl`. Two thresholds, not one, or a finger sitting on the line chatters.
# Measured: extended fingers land 160-179, curled ones 90-130.
extend = 155.0
curl = 138.0
# The pinky gets a stricter bar. It's the finger people are least deliberate
# about: a hand mid-swipe lets it drift out to ~159 degrees, while a genuinely
# spread palm puts it at ~174. Judged by the same 155 as the others, those two
# poses are indistinguishable — which is what made parking unreliable. When
# they're close, PALM has to win: it's how you stop the cursor.
pinky_extend = 166.0
pinky_curl = 150.0
# Thumb swung clear of the palm, in degrees. Tucked reads under 20, spread
# near 50. Either this or the pinky is enough to call a hand open.
thumb_out = 40.0

[pinch]
# Thumb tip to index tip over hand size. Measured: pinched 0.2, open 1.5.
enter = 0.50
exit = 0.70
# Pinch gets a much shorter confirmation than a pose does, because it's a far
# cleaner signal — the gap between pinched and open is enormous, where the
# difference between two and three fingers is a few degrees. A real pinch only
# lasts 2-4 frames at 10 fps, so anything longer than this drops half of them.
dwell = 0.06

[pose]
# How long a pose must hold before we believe it. At ~10 fps this is 2-3
# frames, enough to ride out a single bad detection without feeling sticky.
dwell = 0.25
# Scroll and swipe are modes, not actions — nothing is lost by being slower to
# believe them, and both fire real input, so a transient misread is expensive.
modal_dwell = 0.45
# Leaving PARKED asks for one of these poses, held this long. Pointing is the
# only way to take control — a hand just resting in view sits with two or three
# fingers out most of the time, and letting that wake things up is where nearly
# every false click came from.
wake_poses = ["POINT"]
wake = 0.45
# Hand missing for longer than this counts as gone. Shorter and MediaPipe's
# routine dropped frames release a held pinch mid-drag.
lost_grace = 0.25
# Point your hand at the camera and it foreshortens — every 2D method falls
# apart and none can tell. So watch for hand size collapsing against its recent
# median and freeze instead of guessing.
foreshorten = 0.62

[cursor]
# Hand travel to screen travel. 2.0 means crossing half the frame crosses the
# whole screen. Lower feels heavier and more precise.
gain = 2.0
# One Euro filter. min_cutoff down = steadier when still but laggier;
# beta up = less lag when moving fast but jumpier.
min_cutoff = 0.5
beta = 5.0
d_cutoff = 1.0

[scroll]
# Rate control: how far you've moved from where the pose started sets the
# scroll *speed*, not the position. A dropped frame costs a little speed for
# one frame instead of desynchronising the whole gesture.
settle = 0.20        # hold the pose this long before any of it counts
deadzone = 0.25      # hand sizes of slack before anything moves
full = 1.20          # displacement that means full speed
max_rate = 14.0      # ticks per second at full speed

[swipe]
distance = 1.00      # hand sizes travelled before it fires
dominance = 1.80     # how much more sideways than vertical it has to be
window = 1.20        # travel has to happen within this rolling window
refractory = 0.60    # dead time after a swipe, so one flick isn't two

[hid]
# What the Mac actually receives. Everything above this line is about deciding
# what you meant; everything here is about saying it.

# bluetooth | usb | null. USB needs a part that separates power from data on
# the Pi's one USB-C port — until that exists, Bluetooth is the only one that
# reaches a Mac. `null` prints reports instead and runs anywhere.
backend = "bluetooth"
# What shows up in the Mac's Bluetooth list.
name = "Hands-Free"

# relative | absolute.
# `relative` sends deltas, the way every mouse does. macOS then applies its own
# pointer acceleration, so hand position and cursor position drift apart over a
# session and the One Euro filter ends up fighting a second, invisible one.
# `absolute` reports a position in a fixed box, the way a graphics tablet does:
# no acceleration, no drift, and the engine already works in normalized screen
# space so it's very nearly a straight multiply. Relative is the default only
# because it's the one every host is guaranteed to understand — try absolute.
pointer = "relative"

# Virtual pixels for a full sweep of the cursor across its normalized range.
# Interacts with [cursor] gain, which decides how much hand travel that takes.
# Higher = faster and coarser.
speed = 1400
# Ceiling on cursor speed, in those same pixels per second. One bad landmark
# frame must not be able to fling the cursor across the screen.
#
# A speed, not a per-report distance, because a per-report cap quietly means
# different things at 9.5 fps and 120 Hz — and the first version of this was a
# flat 30 px/report, which never bound at 120 Hz and clipped perfectly ordinary
# movement whenever the driver was pumped once per vision frame. Everything
# else in this file is in seconds or hand-sizes for the same reason.
#
# Whatever the cap refuses is discarded, not deferred. Carrying it would make
# one bad frame into a cursor that slides for a second after your hand stopped,
# and keeps sliding through an open palm — which would mean the clutch no
# longer stops the cursor dead.
max_speed = 2600

# The interpolation thread. The vision loop sets a new target about nine times
# a second; sending those straight through gives a cursor that arrives in 110ms
# jumps, which reads as lag even though the latency is identical. This eases
# between them instead.
interpolate_hz = 120
# Time constant of that easing, in seconds. Roughly how long it takes to cover
# most of the distance to a new target. Up = smoother and laggier; 0 disables
# it and sends targets raw.
ease = 0.045

# The two guards that stop a held button outliving the gesture that started it.
# A stuck mouse button makes a Mac unusable, so both are deliberately shorter
# than feels necessary — ending a drag early is an annoyance, leaving one open
# is a reboot.
# No update from the vision loop for this long and the button is released. The
# loop runs at ~9.5 fps with spikes to 219ms, so this is about 5x headroom.
watchdog = 1.00
# Hard ceiling on a held button, whatever the gesture layer believes. Needed:
# recordings/drag.jsonl ends with a pinch the engine never sees released and an
# 8 second drag still open.
max_drag = 6.00

# Multiplier on scroll ticks. Negative flips the direction, which is what you
# want if macOS "natural scrolling" is set the opposite way to your hand.
scroll = 1.0

# macOS multi-touch gestures can't be sent by any external device, so a
# three-finger swipe becomes a keyboard shortcut. These are the Mission Control
# space-switching defaults — check they're actually enabled in the target Mac's
# Keyboard Shortcuts before blaming the code. `cmd+shift+[` / `]` for tabs is
# the other obvious pair.
swipe_left = "ctrl+left"
swipe_right = "ctrl+right"
